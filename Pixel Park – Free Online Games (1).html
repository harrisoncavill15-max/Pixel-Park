body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Nunito,system-ui,sans-serif}

.logo{font-size:28px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
.search{flex:1;min-width:160px;padding:10px 16px;border-radius:99px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}

.tile:hover{transform:scale(1.05) rotate(-1deg)}
.tile span{font-size:54px;line-height:1}.tile small{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);border-radius:99px;padding:1px 8px;font:700 11px Nunito}
.tile.soon{opacity:.55;cursor:default}.tile.soon:hover{transform:none}
.empty{color:var(--mute);padding:20px 0}

footer{text-align:center;color:var(--mute);padding:24px 16px 32px}footer a{color:var(--blue);font-weight:700}

canvas{width:100%;max-width:400px;display:block;margin:auto;border-radius:14px;background:#14123a;touch-action:none}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.card.up{background:var(--bg);color:var(--ink)}.card.done{background:#3ee6b0}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:10px}
.pad button{height:48px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:20px;cursor:pointer}
.stat{font:800 18px 'Baloo 2'}
.tap{position:relative;height:300px;background:var(--bg);border-radius:14px;overflow:hidden}
.tap button{position:absolute;width:56px;height:56px;border-radius:50%;border:0;background:#ff5a7a;font-size:28px;cursor:pointer}
